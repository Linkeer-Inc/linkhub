server {
    listen 80;
    listen [::]:80;

    server_name yourlinks.com.br *.yourlinks.com.br;

    server_tokens off;

    client_max_body_size 20M;

    access_log /var/log/nginx/yourlink.access.log;
    error_log /var/log/nginx/yourlinks.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }
}

server {
    listen 443 ssl;

    server_name yourlinks.com.br *.yourlinks.com.br;

    server_tokens off;

    client_max_body_size 20M;

    access_log /var/log/nginx/yourlink-ssl.access.log;
    error_log /var/log/nginx/yourlinks-ssl.error.log;

    ssl_certificate /etc/letsencrypt/live/yourlinks.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourlinks.com.br/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /storage/ {
        alias /app/storage/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }
}
