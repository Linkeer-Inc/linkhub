<!doctype html>
<html class="dark" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Página 404 - Perfil Não Encontrado</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      body {
        font-family: "Inter", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-[#111418] dark:text-white min-h-screen flex items-center justify-center font-display transition-colors duration-200"
  >
    <main class="w-full px-6 py-12">
      <div class="max-w-[640px] mx-auto flex flex-col items-center text-center">
        <div class="relative mb-10 w-full flex justify-center">
          <div
            class="w-64 h-64 md:w-80 md:h-80 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center"
          >
            <span
              class="material-symbols-outlined text-primary text-[120px] md:text-[160px]"
            >
              search_off
            </span>
          </div>
          <div
            class="absolute top-10 right-10 md:right-20 w-12 h-12 bg-blue-400/20 rounded-lg"
          ></div>
          <div
            class="absolute bottom-10 left-10 md:left-20 w-8 h-8 bg-blue-500/20 rounded-full"
          ></div>
        </div>
        <div class="flex flex-col gap-4 mb-10">
          <h1
            class="text-3xl md:text-5xl font-black text-[#111418] dark:text-white tracking-tight"
          >
            Página não encontrada
          </h1>
          <p
            class="text-[#617589] dark:text-gray-400 text-lg md:text-xl font-normal leading-relaxed max-w-[520px] mx-auto"
          >
            O perfil que você está procurando não existe ou foi removido. Que
            tal criar o seu próprio perfil de links e começar sua presença
            digital?
          </p>
        </div>
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
          <a
            target="_blank"
            href="https://wa.me/5583988217200?text=Olá, me interessei pelo linkhub, podemos fazer um orçamento ?"
            class="flex min-w-[220px] cursor-pointer items-center justify-center rounded-xl h-14 px-8 bg-primary text-white text-base font-bold shadow-lg shadow-blue-500/20 hover:bg-blue-600 transition-all"
          >
            Criar meu perfil agora
          </a>
          <a
            href="{{ APP_URL }}"
            class="flex flex-1 min-w-[220px] cursor-pointer items-center justify-center rounded-xl h-14 px-8 bg-white dark:bg-gray-800 border-2 border-[#f0f2f4] dark:border-gray-700 text-[#111418] dark:text-white text-base font-bold hover:bg-gray-50 dark:hover:bg-gray-700 transition-all active:scale-95"
          >
            Ir para a página inicial
          </a>
        </div>
        <div
          class="mt-16 flex items-center gap-2 text-[#617589] dark:text-gray-500 text-sm font-medium"
        >
          <span class="material-symbols-outlined text-sm">verified_user</span>
          Plataforma Segura
        </div>
      </div>
    </main>
  </body>
</html>
