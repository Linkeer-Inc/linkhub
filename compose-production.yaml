services:
  db:
    image: postgres:18.1-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - app

  web:
    image: nginx:1.29
    container_name: linkeer-nginx
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
      - gunicorn_socket:/run
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_web:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app
    depends_on:
      - app

  app:
    container_name: linkeer-app
    build:
      context: .
    env_file:
      - .env
    command: gunicorn linkhub.wsgi:application --workers=3 --bind unix:/run/gunicorn.sock
    volumes:
      - .:/app
      - gunicorn_socket:/run
    networks:
      - app
    depends_on:
      - db

  certbot:
    image: certbot/certbot:latest
    container_name: linkeer-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_web:/var/www/certbot
    depends_on:
      - web
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email seu-email@dominio.com
      --agree-tos
      --no-eff-email
      -d seu-dominio.com
      -d www.seu-dominio.com

networks:
  app:

volumes:
  postgres_data:
    driver: local
  gunicorn_socket:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
  certbot_web:
    driver: local
