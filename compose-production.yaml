services:
  db:
    image: postgres:18.1-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    networks:
      - app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    image: nginx:1.29
    container_name: "linkeer-nginx"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
      - gunicorn_socket:/run
    ports:
      - "80:80"
    networks:
      - app
  app:
    container_name: "linkeer-app"
    build:
      context: .
    env_file:
      - .env
    command: "gunicorn linkhub.wsgi:application --workers=3 --bind unix:/run/gunicorn.sock"
    volumes:
      - gunicorn_socket:/run
    ports:
      - "8000:8000"
    networks:
      - app
    depends_on:
      - db
      - web

networks:
  app:
volumes:
  postgres_data:
  gunicorn_socket:
