<!doctype html>

<html class="light" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{tenant.name}} - LinkHub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-white dark:bg-background-dark text-[#111418] dark:text-white transition-colors duration-200"
  >
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
      <div class="layout-container flex h-full grow flex-col">
        <main class="flex flex-1 justify-center py-12 px-6">
          <div
            class="layout-content-container flex flex-col max-w-[520px] w-full items-center"
          >
            <!-- Logo / Header Image Wrapper -->
            <div class="mb-6">
              <div
                class="w-20 h-20 rounded-full border-2 border-primary/10 bg-white p-1 shadow-sm overflow-hidden flex items-center justify-center"
              >
                <div
                  class="w-full h-full bg-center bg-no-repeat bg-cover rounded-full"
                  data-alt="Logotipo minimalista da empresa circular"
                  style="
                    background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuArWZTFI6HeDQjDkI12DiXCQEtn77xAa0RBNBZbz3nFlM9palfbYZ9fJhZkvAswIBtU0l2X58p2eagDTOcbf-uPC1sY23Bq6-ErLBuDIf4886MTQ7FqELjS3-fkidTNDYgxHAUhwgcEDezZTOZRLk8AflY9Kg5ehvYHv1V0kwfNqhEAWTvv33UEAKszy52QxDQqegNVf4Y9H0MC0CRuQKJcJ4U0uULacpO054HYrGjuDVc7947ZeFvdZpWEcTFpqTP2c0x0ftOL8UQ&quot;);
                  "
                ></div>
              </div>
            </div>
            <!-- Company Info -->
            <div class="text-center mb-10">
              <h1
                class="text-[#111418] dark:text-white tracking-tight text-3xl font-bold leading-tight pb-2 font-display"
              >
                {{ tenant.name }}
              </h1>
              <p
                class="text-[#617589] dark:text-gray-400 text-base font-normal leading-relaxed max-w-[400px] mx-auto font-display"
              >
                Transformando ideias em realidade digital. Confira nossos
                principais canais e serviços abaixo.
              </p>
            </div>

            <div class="flex flex-col gap-4 w-full">
              {% for link in domain.links.all %}
              <a
                target="_blank"
                class="group flex min-h-[56px] w-full cursor-pointer items-center justify-center rounded-xl border border-[#e5e7eb] dark:border-gray-700 bg-white dark:bg-background-dark px-6 py-3 transition-all hover:border-primary hover:bg-primary/5 active:scale-[0.98]"
                href="{{link.url}}"
              >
                <span
                  class="text-[#111418] dark:text-white text-base font-medium leading-normal group-hover:text-primary transition-colors"
                  >{{link.name}}</span
                >
              </a>
              {% endfor %}
            </div>

            <div class="flex gap-6 mt-12 mb-8">
              <a
                class="text-[#617589] hover:text-primary transition-colors"
                href="#"
              >
                <span
                  class="material-symbols-outlined text-2xl"
                  data-icon="language"
                  >public</span
                >
              </a>
              <a
                class="text-[#617589] hover:text-primary transition-colors"
                href="#"
              >
                <span
                  class="material-symbols-outlined text-2xl"
                  data-icon="mail"
                  >mail</span
                >
              </a>
              <a
                class="text-[#617589] hover:text-primary transition-colors"
                href="#"
              >
                <span
                  class="material-symbols-outlined text-2xl"
                  data-icon="smartphone"
                  >smartphone</span
                >
              </a>
            </div>

            <div class="mt-auto pt-8">
              <p
                class="text-[#9ca3af] text-xs font-normal tracking-wide uppercase px-4 text-center"
              >
                Construído com
                <a
                  class="underline hover:text-primary transition-colors font-semibold"
                  href="#"
                  >LinkHub</a
                >
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
