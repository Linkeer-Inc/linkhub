<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{ tenant.name }} - LinkHub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "primary-dark": "#0d5fb1",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      body {
        font-family: "Inter", sans-serif;
      }
      
      @layer components {
        .card-link {
          @apply relative overflow-hidden rounded-2xl bg-gradient-to-br from-white/5 to-white/[0.02] backdrop-blur-xl border border-white/10 transition-all duration-500 hover:border-white/30 hover:shadow-2xl hover:shadow-primary/20;
        }
        
        .card-link:hover {
          @apply bg-gradient-to-br from-white/10 to-white/5;
        }
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-[{{ tenant.primary_color }}]/90 via-slate-900 to-black min-h-screen text-white transition-colors duration-200"
  >
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
      <div class="layout-container flex h-full grow flex-col">
        <main class="flex flex-1 justify-center py-16 md:py-24 px-4 md:px-6">
          <div
            class="layout-content-container flex flex-col max-w-[600px] w-full items-center"
          >
            <div class="mb-16">
              <div
                class="w-20 h-20 md:w-24 md:h-24 rounded-2xl border border-emerald-500/60 bg-white shadow-lg shadow-emerald-500/20 overflow-hidden flex items-center justify-center backdrop-blur-md"
              >
                <img
                  class="w-4/5 h-4/5 object-contain"
                  alt="Logotipo de {{ tenant.name }}"
                  src="{{ MEDIA_URL }}{{tenant.branding_icon}}"
                />
              </div>
            </div>

            <div class="text-center mb-14">
              <h1
                class="text-white tracking-tighter text-3xl md:text-4xl font-black leading-tight pb-4 font-display drop-shadow-lg"
              >
                {{ tenant.name }}
              </h1>
              <p
                class="text-white/60 text-base md:text-lg font-normal leading-relaxed max-w-[450px] mx-auto font-display"
              >
                {{ tenant.description }}
              </p>
            </div>

            {% if domain.links.all %}
            <div class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-16">
              {% for link in domain.links.all %}
              <a
                href="{{ link.url }}"
                target="_blank"
                rel="noopener noreferrer"
                class="card-link group
                {% if forloop.counter <= 2 %}
                  lg:col-span-1 row-span-2
                {% endif %}
                p-8 flex flex-col items-center justify-start text-center min-h-[240px] sm:min-h-[280px]"
              >
                <div class="relative z-10 flex flex-col items-center gap-4 w-full">
                  <div class="flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-br from-[{{ tenant.primary_color }}]/25 to-[{{ tenant.primary_color }}]/10 border border-[{{ tenant.primary_color }}]/40 group-hover:from-[{{ tenant.primary_color }}]/40 group-hover:to-[{{ tenant.primary_color }}]/20 group-hover:border-[{{ tenant.primary_color }}]/70 transition-all duration-500 shadow-lg shadow-[{{ tenant.primary_color }}]/15 group-hover:shadow-[{{ tenant.primary_color }}]/30">
                    <i
                      class="text-4xl text-white drop-shadow-lg transition-all duration-500 filter brightness-110
                      {% if link.category.name == "Instagram" %}
                        fab fa-instagram
                      {% elif link.category.name == "WhatsApp" %}
                        fab fa-whatsapp
                      {% elif link.category.name == "Site" %}
                        fas fa-globe
                      {% elif link.category.name == "Linkedin" %}
                        fab fa-linkedin
                      {% elif link.category.name == "YouTube" %}
                        fab fa-youtube
                      {% else %}
                        fas fa-link
                      {% endif %}
                      "
                    ></i>
                  </div>
                
                  <div class="flex-1">
                    <h3 class="text-white text-lg font-bold leading-snug mb-2 transition-colors duration-300 drop-shadow-md">
                      {{ link.name }}
                    </h3>
                    <p class="text-white/70 text-sm font-normal drop-shadow-sm">
                      {{ link.category.name }}
                    </p>
                  </div>
                </div>
              </a>
              {% endfor %}
            </div>
            {% else %}
            <div class="w-full py-16">
              <p class="text-center text-white/40 text-lg">
                Oppss... {{ tenant.name }} ainda não possui links.
              </p>
            </div>
            {% endif %}
            <div class="mt-auto pt-10 border-t border-white/10 w-full">
              <div class="flex flex-col items-center gap-4 text-center">
                <p class="text-white/40 text-xs font-normal tracking-widest uppercase">
                  Powered by
                  <span class="font-semibold text-white/50 ml-1">{{ APP_NAME }}</span>
                </p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
